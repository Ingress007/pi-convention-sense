name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.19.0
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Pi development baseline
        run: node -e "for (const name of ['pi-coding-agent', 'pi-ai']) { const v = require('./node_modules/@earendil-works/' + name + '/package.json').version; if (v !== '0.87.1') throw new Error('Expected ' + name + ' 0.87.1, got ' + v); console.log(name + ' ' + v) }"

      # Includes the offline real-Pi lifecycle tests (Pi's own loader, agent loop and extension runner
      # driven by a scripted faux model): no network access or credentials are needed.
      - name: Typecheck and test
        run: npm run verify

      # One cell is enough to enforce the gate; the skipped platform-specific tests differ per OS.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        run: npm run coverage

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package contents
        run: npm pack --dry-run

      # Only what ships is audited. Dev-only findings inside Pi's own pinned dependency tree are not
      # actionable here.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
